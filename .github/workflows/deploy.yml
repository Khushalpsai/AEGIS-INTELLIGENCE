# ──────────────────────────────────────────────────────────────────────────────
# AEGIS-INTELLIGENCE — Cloudflare Pages Continuous Deployment
#
# Triggers on every push to the `main` branch.
# Builds the React/Vite frontend and deploys it to Cloudflare Pages via
# the official Wrangler GitHub Action.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   — A Cloudflare API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — Your Cloudflare Account ID (found in the Cloudflare dashboard)
#
# Required Cloudflare Pages project:
#   Create the project once manually in the Cloudflare dashboard (or via `wrangler pages project create`),
#   then set CLOUDFLARE_PAGES_PROJECT_NAME below to match.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main          # Redeploy every time code is pushed to main
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

env:
  CLOUDFLARE_PAGES_PROJECT_NAME: aegis-intelligence   # ← change to your Cloudflare Pages project name

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write   # needed for GitHub Deployments status

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js (matches the version used in local development)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Install frontend dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4. Build the production bundle
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Pass any build-time environment variables here (e.g. API base URL)
          # VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          NODE_ENV: production

      # 5. Deploy dist/ to Cloudflare Pages via Wrangler
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT_NAME }} --commit-dirty=true
